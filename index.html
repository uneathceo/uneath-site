<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uneath</title>
  <meta name="description" content="Uneath, Inc., Palo Alto, California.">
  <meta property="og:title" content="Uneath">
  <meta property="og:description" content="Uneath, Inc., Palo Alto, California.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://uneath.com/">
  <meta name="theme-color" content="#F2EFE7">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --linen: #F2EFE7;      /* margin around the sheet */
      --eggshell: #FBFAF6;   /* the sheet itself */
      --emerald: #1A5C45;
      --emerald-deep: #123F30;
      --ink: #16191C;
      --ink-soft: #2E3338;
      --label: #6B6D6E;
      --rule: rgba(22, 25, 28, 0.16);
      --inset: 20px;
    }
    @media (max-width: 640px) { :root { --inset: 12px; } }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--linen); }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: var(--inset);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* The eggshell sheet inside the frame; linen shows around it */
    body::before {
      content: "";
      position: fixed;
      inset: var(--inset);
      background: var(--eggshell);
      z-index: -1;
    }
    ::selection { background: var(--emerald); color: var(--eggshell); }

    /* Sheet frame with ISO-style centering marks */
    .frame {
      position: fixed;
      inset: var(--inset);
      border: 1px solid var(--rule);
      pointer-events: none;
      z-index: 2;
    }
    .frame::before, .frame::after, .frame i::before, .frame i::after {
      content: "";
      position: absolute;
      background: var(--rule);
    }
    .frame::before   { top: -1px;    left: 50%; width: 1px; height: 8px; }
    .frame::after    { bottom: -1px; left: 50%; width: 1px; height: 8px; }
    .frame i::before { left: -1px;   top: 50%;  width: 8px; height: 1px; }
    .frame i::after  { right: -1px;  top: 50%;  width: 8px; height: 1px; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12vh 24px 8vh;
    }
    .mark {
      height: clamp(88px, 20vw, 120px);
      width: auto;
      display: block;
      fill: var(--emerald);
    }
    h1 {
      margin-top: 30px;
      font-weight: 700;
      font-size: clamp(32px, 8vw, 54px);
      letter-spacing: 0.14em;
      padding-left: 0.14em; /* offsets trailing tracking so the word centres */
      line-height: 1;
      text-transform: uppercase;
      color: var(--ink);
    }

    footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }
    .legal {
      padding: 0 0 10px 12px;
      font-size: 12px;
      color: var(--label);
      white-space: nowrap;
    }

    /* Title block: top/left borders only; the frame supplies right and bottom */
    .block {
      width: min(100%, 500px);
      flex: none;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      border-top: 1px solid var(--rule);
      border-left: 1px solid var(--rule);
      overflow: hidden;
    }
    .block div {
      padding: 10px 12px 11px;
      min-width: 0;
      box-shadow: 1px 1px 0 0 var(--rule); /* cell dividers; outer edges clipped by the block */
    }
    .block .w3 { grid-column: span 3; }
    .block .w6 { grid-column: span 6; }
    dt {
      font-size: 12px;
      color: var(--label);
      margin-bottom: 3px;
    }
    dd {
      font-size: 14px;
      line-height: 1.3;
      color: var(--ink-soft);
      overflow-wrap: anywhere;
    }
    dd a {
      color: var(--emerald);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      text-decoration-color: rgba(26, 92, 69, 0.35);
      transition: color 120ms ease, text-decoration-color 120ms ease;
    }
    dd a:hover { color: var(--emerald-deep); text-decoration-color: currentColor; }
    dd a:focus-visible { outline: 2px solid var(--emerald); outline-offset: 3px; border-radius: 2px; }

    @media (max-width: 640px) {
      main { padding: 10vh 16px 7vh; }
      footer { flex-direction: column; align-items: stretch; gap: 10px; }
      .legal { padding: 0 0 0 4px; }
      .block { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      dd a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Uneath mark">
      <path d="M86 6V60A36 36 0 0 1 14 60V6H36V60A14 14 0 0 0 64 60V6Z"/>
    </svg>
    <h1>Uneath</h1>
  </main>

  <footer>
    <p class="legal">&copy; 2026 Uneath, Inc.</p>
    <dl class="block" aria-label="Company details">
      <div class="w3"><dt>Company</dt><dd>Uneath, Inc.</dd></div>
      <div class="w3"><dt>Location</dt><dd>Palo Alto, California</dd></div>
      <div class="w3"><dt>Field</dt><dd>Medical Devices</dd></div>
      <div class="w3"><dt>Status</dt><dd>In Development Since 2023</dd></div>
      <div class="w6"><dt>Contact</dt><dd><a href="mailto:eli@uneath.com">eli@uneath.com</a></dd></div>
    </dl>
  </footer>

  <div class="frame" aria-hidden="true"><i></i></div>
</body>
</html>
